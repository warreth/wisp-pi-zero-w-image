# wisp-pi-zero-w configuration.
#
# Edit this file on the boot partition (bootfs) after flashing, save it,
# eject the SD card, and boot the Pi. The first boot applies it once.
#
# Keep the quotes. Use a 2.4 GHz Wi-Fi network (the Pi Zero W has no 5 GHz).

# Name shown in Music Assistant and used as hostname.
WISP_NAME="wisp"

# Music Assistant Sendspin endpoint. Use the LAN IP of your MA server.
# Example: ws://192.168.1.10:8927/sendspin
WISP_SERVER="ws://192.168.1.10:8927/sendspin"

# "auto" finds the first USB sound card. Override with e.g. "plughw:1,0".
WISP_DEVICE="auto"

# Initial hardware volume (0-100). MA can change it afterwards.
WISP_VOLUME="80"

# Wi-Fi credentials. Leave blank if the network is already configured.
WISP_WIFI_SSID=""
WISP_WIFI_PASSWORD=""
WISP_WIFI_COUNTRY="BE"

# Optional: enable SSH for debugging by pasting a public key (one line).
# Password login stays disabled.
# WISP_SSH_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
